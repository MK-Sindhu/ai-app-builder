# What each machine in the auto scaling group runs: the worker and code-server,
# sharing the project folder. The launch template's user data pulls the images CI pushed and starts them:
#   docker compose --env-file apps/worker/.env -f docker-compose.worker.yml pull
#   docker compose --env-file apps/worker/.env -f docker-compose.worker.yml up -d
# Add --build to `up` to build them from this checkout instead.
services:
  worker:
    image: ghcr.io/mk-sindhu/ndstill-worker:latest
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: apps/worker/.env
    ports:
      - "9091:9091"
      # Vite's dev server: the preview of the site
      - "8081:8081"
    volumes:
      - project:/tmp/bolty-worker
    restart: unless-stopped

  # No env_file here: the worker's secrets must not reach code-server, where the user has a terminal.
  # No login either: the router checks each user, and only the control server can reach port 8080.
  code-server:
    image: ghcr.io/mk-sindhu/ndstill-code-server:latest
    build: apps/code-server
    ports:
      - "8080:8080"
    volumes:
      - project:/tmp/bolty-worker
    restart: unless-stopped

volumes:
  project:
