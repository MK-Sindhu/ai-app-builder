# What each machine in the auto scaling group runs: the worker and code-server,
# sharing the project folder. Start it from the launch template's user data with:
#   docker compose --env-file apps/worker/.env -f docker-compose.worker.yml up -d --build
services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: apps/worker/.env
    ports:
      - "9091:9091"
    volumes:
      - project:/tmp/bolty-worker
    restart: unless-stopped

  # No env_file here: the worker's secrets must not reach code-server, where the user has a terminal.
  # No login either: the router checks each user, and only the control server can reach port 8080.
  code-server:
    build: apps/code-server
    ports:
      - "8080:8080"
    volumes:
      - project:/tmp/bolty-worker
    restart: unless-stopped

volumes:
  project:
