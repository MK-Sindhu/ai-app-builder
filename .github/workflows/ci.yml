name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run generate
        working-directory: packages/db

      - name: Type check
        run: bun run check-types

      - name: Worker tests
        run: bun test
        working-directory: apps/worker

      - name: Orchestrator type check
        run: bun install --frozen-lockfile && bun run check-types
        working-directory: worker-orchestrator

  # Builds the images, and on main pushes them to GitHub's registry, where the servers pull them from
  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    env:
      # Must match the image names in docker-compose.control.yml and docker-compose.worker.yml
      IMAGES: ghcr.io/mk-sindhu
      # Links each image to this repo on GitHub
      SOURCE: org.opencontainers.image.source=https://github.com/MK-Sindhu/ai-app-builder
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          docker build --label "$SOURCE" -f apps/primary-backend/Dockerfile -t "$IMAGES/ndstill-backend" -t "$IMAGES/ndstill-backend:$GITHUB_SHA" .
          docker build --label "$SOURCE" -f apps/worker/Dockerfile -t "$IMAGES/ndstill-worker" -t "$IMAGES/ndstill-worker:$GITHUB_SHA" .
          docker build --label "$SOURCE" -t "$IMAGES/ndstill-orchestrator" -t "$IMAGES/ndstill-orchestrator:$GITHUB_SHA" worker-orchestrator
          docker build --label "$SOURCE" -t "$IMAGES/ndstill-code-server" -t "$IMAGES/ndstill-code-server:$GITHUB_SHA" apps/code-server

      - name: Push
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in ndstill-backend ndstill-worker ndstill-orchestrator ndstill-code-server; do
            docker push --all-tags "$IMAGES/$name"
          done
